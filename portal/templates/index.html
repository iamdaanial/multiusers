<h1>Tenants</h1>
{% for t in tenants %}
<p>
    {{ t[0] }} - {{ t[1] }}GB - <a href="https://localhost:{{ t[2] }}">https://localhost:{{ t[2] }}</a>
<form action="/edit/{{ t[0] }}" method="POST" style="display:inline">
    <input type="number" name="storage" placeholder="New GB" style="width:70px">
    <button type="submit">Edit</button>
</form>
<form action="/delete/{{ t[0] }}" method="POST" style="display:inline">
    <button type="submit">Delete</button>
</form>
</p>
{% endfor %}

<form action="/add" method="POST">
    <input type="text" name="name" placeholder="Tenant name">
    <input type="number" name="storage" placeholder="Storage (GB)">
    <input type="password" name="password" placeholder="Admin password">
    <button type="submit">Add Tenant</button>
</form>
