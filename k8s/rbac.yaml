apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: portal
rules:
  - apiGroups: [""]
    resources: ["services", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: portal
subjects:
  - kind: ServiceAccount
    name: portal